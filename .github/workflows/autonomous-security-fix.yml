name: Security scan and PR

# Scan on main. Never mutate the default branch.
# Fixes (if any) go to an isolated branch via create-pull-request only.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      apply_safe_fixes:
        description: "Apply non-force npm audit fix / pip-audit --fix onto a PR branch"
        type: boolean
        default: false
  push:
    branches: [main, master, stable]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/requirements.txt"
      - "**/requirements.in"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      npm_vulns: ${{ steps.npm_audit.outputs.npm_vulns_found }}
      python_vulns: ${{ steps.python_audit.outputs.python_vulns_found }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm audit (lockfile tree only)
        id: npm_audit
        run: |
          echo "npm_vulns_found=false" >> "$GITHUB_OUTPUT"
          if [ ! -f package-lock.json ]; then
            echo "No root package-lock.json — skip npm audit"
            exit 0
          fi
          set +e
          npm audit --omit=dev --json > npm-audit.json
          RC=$?
          set -e
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("npm-audit.json")
          found = False
          try:
              data = json.loads(p.read_text() or "{}")
              meta = (data.get("metadata") or {}).get("vulnerabilities") or {}
              found = any(int(meta.get(k) or 0) > 0 for k in ("critical", "high", "moderate", "low"))
              print("npm vulnerability counts:", meta)
          except Exception as e:
              print("npm audit json parse:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"npm_vulns_found={'true' if found else 'false'}\n")
          PY
          if [ "$RC" -gt 1 ]; then
            echo "npm audit failed with $RC"
            exit "$RC"
          fi

      - name: pip-audit
        id: python_audit
        run: |
          echo "python_vulns_found=false" >> "$GITHUB_OUTPUT"
          python -m pip install -q pip-audit
          REQ=requirements.txt
          if [ ! -f "$REQ" ]; then
            echo "No requirements.txt"
            exit 0
          fi
          set +e
          python -m pip_audit -r "$REQ" --progress-spinner off | tee pip-audit.txt
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "python_vulns_found=true" >> "$GITHUB_OUTPUT"
          fi
          # pip-audit: 0 = clean, 1 = vulns found, other = tool failure
          if [ "$RC" -ge 2 ]; then
            echo "pip-audit tool failure $RC"
            exit "$RC"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-${{ github.run_id }}
          path: |
            npm-audit.json
            pip-audit.txt
          if-no-files-found: ignore

  propose-fixes:
    needs: scan
    if: >
      github.event_name != 'push' &&
      inputs.apply_safe_fixes == true &&
      (needs.scan.outputs.npm_vulns == 'true' || needs.scan.outputs.python_vulns == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Safe dependency fixes (no --force, no git add -A on default branch)
        run: |
          if [ -f package-lock.json ]; then
            npm audit fix --omit=dev || true
          fi
          if [ -f requirements.txt ]; then
            python -m pip install -q pip-audit
            python -m pip_audit -r requirements.txt --fix || true
          fi

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security-scan-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(security): safe audit fixes"
          title: "chore(security): audit findings ${{ github.run_id }}"
          body: |
            Isolated PR from security scan. No force-push. No `npm audit fix --force`.
            Review before merge. Default branch was not mutated.
          labels: |
            security
            automated

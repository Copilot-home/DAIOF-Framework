name: One-time governance manifest regeneration

on:
  push:
    branches:
      - fix/post-merge-ci-closure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase6-manifest-regenerate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate manifest and remove bootstrap workflow
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test -n "${BRANCH}"
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/heads/${BRANCH}"
          git checkout -q -B "${BRANCH}" FETCH_HEAD
          echo "BRANCH=${BRANCH}" >> "${GITHUB_ENV}"

      - name: Install governance dependency
        run: python3 -m pip install pyyaml

      - name: Remove bootstrap workflow and regenerate evidence
        run: |
          set -euo pipefail
          git rm .github/workflows/phase6-manifest-regenerate.yml
          python3 tools/governance/governance_gate.py generate
          python3 tools/governance/governance_gate.py validate

      - name: Commit regenerated manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(governance): regenerate workflow manifest after CI repair"
          git push origin "HEAD:${BRANCH}"

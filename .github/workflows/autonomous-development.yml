name: 🧬 Autonomous Development - Self-Evolving Organism

on:
  schedule:
    # Autonomous development heartbeat: every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Development task type'
        required: true
        type: choice
        options:
          - auto_improve_code
          - auto_optimize_health
          - full_autonomous_cycle
        default: full_autonomous_cycle

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autonomous_development:
    runs-on: ubuntu-latest
    name: Self-Developing Organism
    
    steps:
      - name: 🧬 Clone Organism DNA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: 🐍 Prepare Organism Environment
        run: python3 --version
      - name: 💉 Install Organism Dependencies
        run: |
          pip install --upgrade pip
          pip install PyGithub pyyaml requests python-dotenv
          pip install black isort
      
      - name: 🧠 Load Organism Genome
        run: |
          echo "🧬 Loading organism configuration..."
          python3 -c "
          import yaml
          with open('.github/DIGITAL_ORGANISM_GENOME.yml') as f:
              genome = yaml.safe_load(f)
              print(f\"Organism loaded: {genome['metadata']['name']}\")
              print(f\"Learning rate: {genome['genes']['behavioral_traits']['learning_rate']}\")
          "
      
      - name: 🤖 Execute Autonomous Development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_TYPE: ${{ github.event.inputs.task_type || 'full_autonomous_cycle' }}
          AUTONOMY_RUN_ID: ${{ github.run_id }}
          AUTONOMY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "🚀 Starting autonomous development cycle..."
          python3 .github/scripts/autonomous_developer.py
      
      - name: 📊 Generate Development Report
        if: always()
        run: |
          echo "📊 Generating organism development report..."
          if [ -f "reports/development_report.md" ]; then
            cat reports/development_report.md >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 🔐 Capture Execution Provenance
        if: always()
        run: |
          mkdir -p .autonomy
          git status --short > .autonomy/git-status-before-commit.txt
          git diff --stat > .autonomy/git-diff-stat-before-commit.txt
          git diff --name-status > .autonomy/git-changed-files-before-commit.txt
          cat > .autonomy/execution-provenance.json <<EOF
          {
            "schema": "APO-AUTONOMY-PROVENANCE-1.0",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "sha_at_start": "${GITHUB_SHA}",
            "actor": "${GITHUB_ACTOR}",
            "triggering_actor": "${{ github.triggering_actor }}",
            "task_type": "${{ github.event.inputs.task_type || 'full_autonomous_cycle' }}",
            "dry_run": false,
            "runner": "${RUNNER_NAME}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: 💾 Commit Organism Evolution
        if: success()
        run: |
          git config user.name "DAIOF Organism"
          git config user.email "organism@daiof-framework.dev"
          
          # Check if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            # Runtime reports/provenance belong to the Actions run, not source history.
            git reset -- .autonomy reports/development_report.md
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            TASK="${{ github.event.inputs.task_type || 'full_autonomous_cycle' }}"
            git commit -m "🧬 Autonomous evolution: $TIMESTAMP - Task: $TASK - Self-development cycle completed [Digital Organism]

Provenance: run=${{ github.run_id }} attempt=${{ github.run_attempt }} actor=${{ github.actor }}"
            git push
            echo "AUTONOMY_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "AUTONOMY_COMMIT_SHA=$(git rev-parse HEAD)"
            echo "✅ Evolution committed and pushed"
          else
            echo "ℹ️ No changes to commit"
          fi
      
      - name: 🏥 Update Health Status
        if: always()
        run: |
          echo "🏥 Running post-development health check..."
          python3 .github/scripts/health_monitor.py || true

      - name: 🔗 Finalize Execution Provenance
        if: always()
        run: |
          export FINAL_COMMIT_SHA="${AUTONOMY_COMMIT_SHA:-$(git rev-parse HEAD)}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('.autonomy/execution-provenance.json')
          if p.exists():
              data = json.loads(p.read_text())
              data['final_commit_sha'] = os.environ['FINAL_COMMIT_SHA']
              data['status'] = '${{ job.status }}'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: 📦 Publish Execution Provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-development-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .autonomy/
          if-no-files-found: warn
          retention-days: 30

name: Build Alpha Omega PDF

on:
  push:
    branches: ['main', 'master', 'stable']
  pull_request:

jobs:
  build-latex-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Install LaTeX packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Build PDF
        working-directory: docs
        run: |
          set -e
          latexmk -xelatex -pdf -quiet alpha_omega.tex

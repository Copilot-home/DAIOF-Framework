name: 🔍 PR Governance Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  governance-review:
    runs-on: ubuntu-latest
    name: Governance risk assessment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        run: python3 --version
      - name: Install governance dependencies
        run: python3 -m pip install pyyaml

      - name: Validate governance evidence
        run: python3 tools/governance/governance_gate.py validate

      - name: Assess PR risk without approving or merging (no external actions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gh_bot.py pr-govreview

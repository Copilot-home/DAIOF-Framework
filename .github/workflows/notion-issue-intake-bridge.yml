name: Notion GitHub Issue Intake Bridge

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  mirror-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror issue into DB_TASKS
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          REPOSITORY: ${{ github.repository }}
          NOTION_DATABASE_ID: "38eba9f29bbc4da7ba2a99afae5c607b"
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ.get("NOTION_API_KEY")
          if not token:
              print("NOTION_BRIDGE_BLOCKED: NOTION_API_KEY missing", file=sys.stderr)
              raise SystemExit(2)

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw": raw[:1000]}
                  return exc.code, body

          me_status, me = request("GET", "https://api.notion.com/v1/users/me")
          print(json.dumps({
              "probe": "notion_identity",
              "http_status": me_status,
              "ok": me_status == 200,
              "error_code": me.get("code") if isinstance(me, dict) else None,
          }, ensure_ascii=False))

          db_id = os.environ["NOTION_DATABASE_ID"]
          db_status, db = request("GET", f"https://api.notion.com/v1/databases/{db_id}")
          print(json.dumps({
              "probe": "db_tasks_access",
              "http_status": db_status,
              "ok": db_status == 200,
              "error_code": db.get("code") if isinstance(db, dict) else None,
              "error_message": db.get("message") if isinstance(db, dict) else None,
          }, ensure_ascii=False))

          if me_status != 200:
              print("NOTION_BRIDGE_BLOCKED: API identity authentication/authorization failed", file=sys.stderr)
              raise SystemExit(10)
          if db_status != 200:
              print("NOTION_BRIDGE_BLOCKED: DB_TASKS is not writable/readable by the GitHub Actions integration", file=sys.stderr)
              raise SystemExit(11)

          title = os.environ["ISSUE_TITLE"]
          issue_number = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPOSITORY"]
          url = os.environ["ISSUE_URL"]
          labels = os.environ.get("ISSUE_LABELS", "")
          body = os.environ.get("ISSUE_BODY") or ""

          payload = {
              "parent": {"database_id": db_id},
              "properties": {
                  "Task Name": {"title": [{"text": {"content": f"[GitHub] #{issue_number} {title}"[:2000]}}]},
                  "Status": {"status": {"name": "In Progress"}},
                  "Assigned To": {"select": {"name": "Notion AI"}},
                  "Impact": {"select": {"name": "Medium"}},
                  "Conversation Log": {"rich_text": [{"text": {"content": f"Source: {repo}#{issue_number} | {url} | labels={labels}"[:2000]}}]},
                  "__PROVENANCE__": {"rich_text": [{"text": {"content": "CERTIFIED_DAIOF"}}]},
              },
              "children": [{
                  "object": "block",
                  "type": "paragraph",
                  "paragraph": {
                      "rich_text": [{
                          "type": "text",
                          "text": {"content": f"GitHub issue intake. State={os.environ['ISSUE_STATE']}. Body: {body[:1500]}"},
                      }]
                  },
              }],
          }

          status, data = request("POST", "https://api.notion.com/v1/pages", payload)
          print(json.dumps({
              "probe": "page_create",
              "http_status": status,
              "ok": status in (200, 201),
              "error_code": data.get("code") if isinstance(data, dict) else None,
              "error_message": data.get("message") if isinstance(data, dict) else None,
          }, ensure_ascii=False))

          if status not in (200, 201):
              print("NOTION_BRIDGE_FAIL: page creation failed", file=sys.stderr)
              raise SystemExit(12)

          page_id = data.get("id")
          page_url = data.get("url")
          if not page_id:
              print("NOTION_BRIDGE_FAIL: response has no page id", file=sys.stderr)
              raise SystemExit(13)

          print(json.dumps({
              "decision": "PASS",
              "receipt": "NOTION_PAGE_CREATED",
              "page_id": page_id,
              "page_url": page_url,
              "github_issue": f"{repo}#{issue_number}",
          }, ensure_ascii=False))
          PY

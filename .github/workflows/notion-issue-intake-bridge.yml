name: Notion GitHub Issue Intake Bridge

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  mirror-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror issue into DB_TASKS with overflow fallback
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          REPOSITORY: ${{ github.repository }}
          NOTION_DATABASE_ID: "38eba9f29bbc4da7ba2a99afae5c607b"
          NOTION_OVERFLOW_PAGE_ID: "25225a7519934e1c80c41635caf8bd1d"
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ.get("NOTION_API_KEY")
          if not token:
              print("NOTION_BRIDGE_BLOCKED: NOTION_API_KEY missing", file=sys.stderr)
              raise SystemExit(2)

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw": raw[:1000]}
                  return exc.code, body

          me_status, _ = request("GET", "https://api.notion.com/v1/users/me")
          db_status, _ = request("GET", f"https://api.notion.com/v1/databases/{os.environ['NOTION_DATABASE_ID']}")
          if me_status != 200:
              print(f"NOTION_BRIDGE_BLOCKED: identity probe HTTP {me_status}", file=sys.stderr)
              raise SystemExit(10)
          if db_status != 200:
              print(f"NOTION_BRIDGE_BLOCKED: DB_TASKS probe HTTP {db_status}", file=sys.stderr)
              raise SystemExit(11)

          repo = os.environ["REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          title = os.environ["ISSUE_TITLE"]
          url = os.environ["ISSUE_URL"]
          labels = os.environ.get("ISSUE_LABELS", "")
          state = os.environ["ISSUE_STATE"]
          body = os.environ.get("ISSUE_BODY") or ""

          payload = {
              "parent": {"database_id": os.environ["NOTION_DATABASE_ID"]},
              "properties": {
                  "Task Name": {"title": [{"text": {"content": f"[GitHub] #{issue_number} {title}"[:2000]}}]},
                  "Status": {"status": {"name": "In Progress"}},
                  "Assigned To": {"select": {"name": "Notion AI"}},
                  "Impact": {"select": {"name": "Medium"}},
                  "Conversation Log": {"rich_text": [{"text": {"content": f"Source: {repo}#{issue_number} | {url} | labels={labels}"[:2000]}}]},
                  "__PROVENANCE__": {"rich_text": [{"text": {"content": "CERTIFIED_DAIOF"}}]},
              },
              "children": [{
                  "object": "block",
                  "type": "paragraph",
                  "paragraph": {"rich_text": [{"type": "text", "text": {"content": f"GitHub issue intake. State={state}. Body: {body[:1500]}"}}]},
              }],
          }

          create_status, created = request("POST", "https://api.notion.com/v1/pages", payload)
          if create_status in (200, 201) and created.get("id"):
              print(json.dumps({
                  "decision": "PASS",
                  "mode": "NEW_DB_TASK",
                  "receipt": "NOTION_PAGE_CREATED",
                  "page_id": created["id"],
                  "page_url": created.get("url"),
                  "github_issue": f"{repo}#{issue_number}",
              }, ensure_ascii=False))
              raise SystemExit(0)

          if create_status != 403 or created.get("code") != "restricted_resource":
              print(json.dumps({
                  "decision": "FAIL",
                  "mode": "NEW_DB_TASK",
                  "http_status": create_status,
                  "error_code": created.get("code"),
                  "error_message": created.get("message"),
              }, ensure_ascii=False), file=sys.stderr)
              raise SystemExit(12)

          # Notion workspace block quota prevents creation. Preserve intake by updating
          # an existing DB_TASKS page's Conversation Log without creating new blocks.
          page_id = os.environ["NOTION_OVERFLOW_PAGE_ID"]
          read_status, page = request("GET", f"https://api.notion.com/v1/pages/{page_id}")
          if read_status != 200:
              print(f"NOTION_OVERFLOW_BLOCKED: existing page read HTTP {read_status}", file=sys.stderr)
              raise SystemExit(13)

          current = ""
          prop = (page.get("properties") or {}).get("Conversation Log") or {}
          for item in prop.get("rich_text", []):
              current += ((item.get("plain_text") or (item.get("text") or {}).get("content") or ""))

          event = f"\n[BRIDGE_OVERFLOW] {repo}#{issue_number} | {url} | state={state} | labels={labels} | title={title} | body={body[:800]}"
          merged = (current + event)[-1900:]

          patch = {
              "properties": {
                  "Status": {"status": {"name": "In Progress"}},
                  "Assigned To": {"select": {"name": "Notion AI"}},
                  "Conversation Log": {"rich_text": [{"text": {"content": merged}}]},
              }
          }
          patch_status, patched = request("PATCH", f"https://api.notion.com/v1/pages/{page_id}", patch)
          if patch_status not in (200, 201):
              print(json.dumps({
                  "decision": "BLOCKED",
                  "mode": "OVERFLOW_FALLBACK",
                  "http_status": patch_status,
                  "error_code": patched.get("code"),
                  "error_message": patched.get("message"),
              }, ensure_ascii=False), file=sys.stderr)
              raise SystemExit(14)

          print(json.dumps({
              "decision": "PASS_WITH_OVERFLOW_FALLBACK",
              "mode": "EXISTING_DB_TASK_EVENT_LOG",
              "receipt": "NOTION_EXISTING_TASK_UPDATED",
              "page_id": page_id,
              "github_issue": f"{repo}#{issue_number}",
              "reason": "workspace_free_block_limit",
          }, ensure_ascii=False))
          PY

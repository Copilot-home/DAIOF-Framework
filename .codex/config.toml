[profiles]
[profiles.local_ollama]
model = 'llama3:latest'
model_provider = 'oss'
model_verbosity = 'low'
oss_provider = 'ollama'

[projects]
[projects.'/']
trust_level = 'trusted'

[projects.'/Users/andy']
trust_level = 'trusted'

[projects.'/Users/andy/Documents/MacOSMac']
trust_level = 'trusted'

[projects.'/Users/andy/Documents/New project']
trust_level = 'trusted'

[projects.'/Volumes/External/OS_LOGICAL_DEPENDENCY_REGISTRY']
trust_level = 'trusted'

profile = "audit"
project_root_markers = [".git", ".hg", ".sl"]

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["*_TOKEN", "*_SECRET", "*_PASSWORD", "AWS_*", "AZURE_*"]
include_only = ["PATH", "HOME", "SHELL", "TERM", "TMPDIR", "CODEX_HOME", "HYPERAI_CANON_FILE", "HYPERAI_CANON_ROOT", "HYPERAI_CANON_ENFORCE", "HYPERAI_CANON_MODE"]

[desktop]
appearanceTheme = "dark"
usePointerCursors = true
reduced-motion-preference = "on"
followUpQueueMode = "steer"
composerEnterBehavior = "cmdIfMultiline"
reviewDelivery = "detached"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-always-force-push = true
git-show-sidebar-pr-icons = true
notifications-turn-mode = "unfocused"
notifications-permissions-enabled = false
notifications-questions-enabled = false
selected-avatar-id = "bsod"
conversationDetailMode = "STEPS_PROSE"

[desktop.open-in-target-preferences]
global = "vscode"

[desktop.open-in-target-preferences.perPath]
"/Users/andy" = "vscode"
"/Users/andy/.codex/worktrees/ea89/andy" = "windsurf"
"/Users/andy/Documents/MacOSMac" = "antigravity"
"/Users/andy/Documents/New project" = "fileManager"

[profiles.audit]
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "medium"
model_verbosity = "low"

[profiles.enforce]
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "medium"
model_verbosity = "low"

[profiles.reset-runtime]
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "low"
model_verbosity = "low"

# Canon + Skill-first enforcement sync (2026-05-22)
project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["AGENTS.md", "AGENT.md"]
hide_agent_reasoning = true

[rules]
# Enforce skill-first and evidence-first behavior when user provides explicit skill path/name.
policy = "skill-first-evidence-first"

[mcp_servers.MCP_DOCKER]
command = "docker"
args = ["mcp", "gateway", "run", "--profile", "ai_coding"]

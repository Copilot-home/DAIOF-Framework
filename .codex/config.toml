model_reasoning_effort = 'medium'
model_verbosity = 'low'
sandbox_mode = 'danger-full-access'

[profiles.local_ollama]
model = 'qwen2.5:1.5b'
model_provider = 'oss'
model_verbosity = 'low'
oss_provider = 'ollama'

[profiles.reset-runtime]
approval_policy = 'never'
hide_agent_reasoning = true
model_reasoning_effort = 'low'
model_verbosity = 'low'
project_doc_fallback_filenames = ['AGENTS.md', 'AGENT.md']
project_doc_max_bytes = 65536
sandbox_mode = 'danger-full-access'

[projects]
[projects.'/']
trust_level = 'trusted'

[projects.'/Users/andy']
trust_level = 'trusted'

[projects.'/Users/andy/Documents/MacOSMac']
trust_level = 'trusted'

[projects.'/Users/andy/Documents/New project']
trust_level = 'trusted'

[projects.'/Users/andy/morphix3d-image-to-3d']
trust_level = 'trusted'

[projects.'/Users/andy/tr-gi-p']
trust_level = 'trusted'

[projects.'/Volumes/External/OS_LOGICAL_DEPENDENCY_REGISTRY']
profile = 'audit'
project_root_markers = ['.git', '.hg', '.sl']
trust_level = 'trusted'

[projects."/Users/andy/DAIOF-Framework"]
trust_level = "trusted"

[rules]
policy = 'skill-first-evidence-first'

[shell_environment_policy]
exclude = ['*_TOKEN', '*_SECRET', '*_PASSWORD', 'AWS_*', 'AZURE_*']
ignore_default_excludes = false
include_only = ['PATH', 'HOME', 'SHELL', 'TERM', 'TMPDIR', 'CODEX_HOME', 'HYPERAI_CANON_FILE', 'HYPERAI_CANON_ROOT', 'HYPERAI_CANON_ENFORCE', 'HYPERAI_CANON_MODE']
inherit = 'core'

[tui.model_availability_nux]
"gpt-5.5" = 1

[notice]
hide_rate_limit_model_nudge = true
hide_full_access_warning = true
